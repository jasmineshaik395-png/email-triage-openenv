name: email-triage-openenv
version: "1.0.0"
description: >
  A real-world email triage environment where AI agents learn to classify,
  prioritize, and respond to emails — just like a human support agent would.
author: "Hackathon Submission"
license: MIT
tags:
  - openenv
  - email
  - nlp
  - real-world
  - triage
  - classification

environment:
  class: EmailTriageEnv
  module: environment
  reset_method: reset
  step_method: step
  state_method: state

action_space:
  type: dict
  fields:
    action_type:
      type: enum
      values: [classify, prioritize, respond, skip, escalate]
      required: true
    category:
      type: enum
      values: [urgent, important, normal, spam]
      required: false
    priority:
      type: enum
      values: [high, medium, low]
      required: false
    response_text:
      type: string
      required: false
    reason:
      type: string
      required: false

observation_space:
  type: dict
  fields:
    current_email:
      type: object
      fields:
        email_id: string
        sender: string
        subject: string
        body: string
        received_at: string
        has_attachment: boolean
        is_reply: boolean
    inbox_count:
      type: integer
    processed_count:
      type: integer
    current_score:
      type: float
      range: [0.0, 1.0]
    task_name:
      type: enum
      values: [easy, medium, hard]
    instructions:
      type: string

tasks:
  - name: easy
    description: Classify emails into correct categories
    objective: Correctly label each email as urgent/important/normal/spam
    passing_score: 0.70
    num_episodes: 8
    difficulty: easy
    grader: graders.grade_easy

  - name: medium
    description: Classify emails AND set the correct priority level
    objective: Correctly classify and prioritize each email
    passing_score: 0.55
    num_episodes: 8
    difficulty: medium
    grader: graders.grade_medium

  - name: hard
    description: Classify, prioritize, and write a professional reply
    objective: Full email handling with quality written responses
    passing_score: 0.40
    num_episodes: 6
    difficulty: hard
    grader: graders.grade_hard

reward:
  range: [0.0, 1.0]
  type: float
  partial_progress: true
  description: >
    Rewards are given at every step. Partial credit for near-correct answers.
    Penalties for skipping, invalid actions, or missing responses.

baseline_scores:
  random_agent:
    easy: 0.25
    medium: 0.17
    hard: 0.12
  llm_agent_gpt4o_mini:
    easy: 0.85
    medium: 0.72
    hard: 0.55
