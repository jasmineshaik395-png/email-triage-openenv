[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "email-triage-openenv"
version = "1.0.0"
description = "A real-world email triage environment for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["openenv", "email", "triage", "rl", "agent"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/skjasmine/email-triage-openenv"
Repository = "https://github.com/jasmineshaik395-png/email-triage-openenv"

[tool.setuptools.packages.find]
where = ["."]
