version = 1
requires-python = ">=3.9"

[[package]]
name = "email-triage-openenv"
version = "1.0.0"
source = { editable = "." }
dependencies = [
  { name = "fastapi" },
  { name = "uvicorn" },
  { name = "pydantic" },
  { name = "requests" },
  { name = "openenv" },
  { name = "openenv-core" },
]

[package.metadata]
requires-dist = [
  { name = "fastapi", specifier = ">=0.100.0" },
  { name = "uvicorn", specifier = ">=0.23.0" },
  { name = "pydantic", specifier = ">=2.0.0" },
  { name = "requests", specifier = ">=2.28.0" },
  { name = "openenv", specifier = ">=0.2.0" },
  { name = "openenv-core", specifier = ">=0.2.0" },
]

[package.metadata.requires-dev]

[[package]]
name = "fastapi"
version = "0.115.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "uvicorn"
version = "0.30.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.7.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "requests"
version = "2.31.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "openenv"
version = "0.2.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "openenv-core"
version = "0.2.0"
source = { registry = "https://pypi.org/simple" }
